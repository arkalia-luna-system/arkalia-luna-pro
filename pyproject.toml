[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkalia-luna-pro"
version = "2.8.0"
description = "Arkalia-LUNA Pro - Kernel IA Ultra-Protection"
authors = [{ name = "Athalia", email = "arkalia.luna.system@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.2",
    "toml==0.10.2",
    "asyncio-mqtt==0.16.1",
    "prometheus-client==0.19.0",
    "psutil==5.9.6",
    "docker==6.1.3",
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.0",
    "isort==5.12.0",
    "pre-commit==3.5.0",
    "bandit==1.7.6",
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.14",
    "safety==2.3.5",
    "detect-secrets==1.4.0",
    "vulture==2.16",
    "pylint==3.0.2",
    "pytest-xdist==3.3.1",
    "pytest-benchmark==4.0.0",
    "interrogate==1.5.0",
    "pydocstyle==6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "isort",
    "pre-commit",
    "bandit",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["node_modules/*", "archive/*", "._*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E203", "F401", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo_*.py" = ["E402", "F401"]
"scripts/arkalia_enhanced_integration.py" = ["F401"]
"scripts/ark-master-*.py" = ["E402", "F401"]
"tests/**/*.py" = ["F841", "E402"]
"modules/**/*.py" = ["W293"]
"modules/generative_ai/generated/test_core.py" = ["I001", "E", "W", "F", "B", "C4", "UP"]
"modules/assistantia/core.py" = ["B008"]  # Depends() est un pattern FastAPI standard

# [tool.ruff.lint.isort]
# known-first-party = ["modules", "scripts"]
# Désactivé car isort cause des problèmes

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | generated
  | cache
  | logs
  | state
  | htmlcov
  | benchmark_results
  | archive
  | \._.*
)/
'''

# [tool.isort]
# profile = "black"
# line_length = 100
# known_first_party = ["modules", "scripts", "demo_global"]
# skip_glob = [
#     "*/generated/*",
#     "*/venv/*",
#     "*/cache/*",
#     "*/logs/*",
#     "*/state/*",
#     "*/htmlcov/*",
#     "*/benchmark_results/*",
#     "*/archive/*"
# ]
# DÉSACTIVÉ - isort cause des problèmes de performance

[tool.coverage.run]
source = [
    "modules",
    "scripts",
    "helloria",
    "core",
    "app",
    "arkalia"
]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/generated/*",
    "*/cache/*",
    "*/logs/*",
    "*/state/*",
    "*/htmlcov/*",
    "*/benchmark_results/*",
    "*/temp/*",
    "*/demo_*/*",
    "*/node_modules/*",
    "*/site/*",
    "*/archive/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*/.mypy_cache/*",
    "*/.pytest_cache/*",
    "*/.ruff_cache/*",
    "*/generative_ai/generated/*",
    "*/security/sandbox/*",
    "*/security/watchdog/*"
]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2
skip_empty = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=modules",
    "--cov=scripts",
    "--cov=helloria",
    "--cov=core",
    "--cov=app",
    "--cov=arkalia",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=15",
    "--ignore=modules/generative_ai/generated/",
    "--ignore-glob=**/._*.py",
    "--asyncio-mode=auto",
    "-x",
    "--maxfail=5",
    "-q"
]
markers = [
    "slow: tests lents",
    "integration: tests d'intégration",
    "unit: tests unitaires",
    "performance: tests de performance",
    "security: tests de sécurité",
    "chaos: tests de chaos",
    "e2e: tests end-to-end (E2E)",
    "smoke: tests de fumée",
    "benchmark: tests de benchmark"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "io_safe\\.py$",
    "tests/chaos/chaos_common\\.py$",
    "tests/common/test_helpers\\.py$",
    "scripts/.*\\.py$",
    "modules/.*/generated/.*\\.py$",
    "modules/generative_ai/generated/.*\\.py$",
    "modules/.*\\.py$"
]
[[tool.mypy.overrides]]
module = "toml"
ignore_missing_imports = true

# Assouplissements ciblés pour permettre le push tout en gardant mypy strict ailleurs
[[tool.mypy.overrides]]
module = ["app.main", "helloria.core"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["modules.reflexia.logic.metrics_enhanced"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["scripts.tools.bootstrap_arkalia"]
ignore_errors = true

[tool.flake8]
max-line-length = 100
ignore = ["E402", "F841", "W293", "F401", "F811", "E203"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "venv",
    ".venv",
    "generated",
    "cache",
    "logs",
    "state",
    "htmlcov",
    "benchmark_results"
]
