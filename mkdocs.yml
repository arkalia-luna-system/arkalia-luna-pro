---
site_name: Arkalia-LUNA Pro
site_description: Système d'Intelligence Artificielle Enterprise - v2.8.0 Production Ready
site_author: Arkalia-LUNA Team
site_url: https://arkalia-luna-system.github.io/arkalia-luna-pro/

repo_name: arkalia-luna-system/arkalia-luna-pro
repo_url: https://github.com/arkalia-luna-system/arkalia-luna-pro

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: slate
      accent: slate
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: slate
      accent: slate
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: fr
      separator: '[\s\-,:!=\[\]()/]+'

extra_css:
  - assets/arkalia-luna-theme.css

extra_javascript:
  - assets/js/arkalia-assistant.js
  - assets/js/arkalia-enhancements.js

# 🚀 Optimisations Performance
extra:
  analytics:
    feedback:
      title: Cette page était-elle utile ?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Cette page m'a aidé
          data: 1
          note: >-
            Merci ! Votre feedback nous aide à améliorer la documentation.
        - icon: material/emoticon-sad-outline
          name: Cette page pourrait être améliorée
          data: 0
          note: >-
            Dites-nous comment améliorer cette page en
            <a href="https://github.com/arkalia-luna-system/arkalia-luna-pro/issues/new" target="_blank" rel="noopener">créant une issue</a>.

  # PWA Configuration
  manifest: assets/docs/manifest.json

# 📊 SEO & Performance
use_directory_urls: true
strict: true

# 🚫 Exclusion des fichiers temporaires macOS
exclude_docs: |
  .!*
  .DS_Store
  Thumbs.db

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true
      title: Sur cette page
      baselevel: 1

nav:
  - Home: README.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Cognitive Levels: getting-started/cognitive-levels.md
      - Use Cases: getting-started/use-cases.md
  - Architecture:
      - Overview: architecture/overview.md
      - Fonctionnement:
          - Structure: architecture/fonctionnement/structure.md
          - Components: architecture/fonctionnement/composants.md
          - Kernel: architecture/fonctionnement/kernel.md
          - Usage: architecture/fonctionnement/utilisation.md
      - Containers: architecture/containers.md
      - Decision Flow: architecture/decision_flow.md
      - Cahier des Charges: architecture/cahier_des_charges_v4.0.md
      - Monitoring Structure: architecture/structure_monitoring_consolidee.md
      - Security Structure: architecture/structure_securite_consolidee.md
      - Utils Structure: architecture/structure_utils_consolidee.md
  - Modules:
      - Overview: modules/zeroia.md
      - Core Modules:
          - ZeroIA: modules/zeroia.md
          - Reflexia: modules/reflexia.md
          - Sandozia: modules/sandozia.md
          - Cognitive Reactor: modules/cognitive-reactor.md
          - AssistantIA: modules/assistantia.md
          - Helloria: modules/helloria.md
      - Security Modules:
          - Security: security/security.md
      - Monitoring Modules:
          - Infrastructure Monitoring: infrastructure/devops/index.md
  - Infrastructure:
      - Overview: infrastructure/index.md
      - Configuration: infrastructure/configuration.md
      - Configuration Guide: infrastructure/configuration-guide.md
      - Deployment: infrastructure/deployment.md
      - Monitoring: infrastructure/monitoring.md
      - CI/CD: infrastructure/ci-cd.md
      - Automation: infrastructure/automation.md
      - DevOps:
          - Overview: infrastructure/devops/index.md
          - Linting Resolution: infrastructure/devops/linting-resolution.md
          - Security: infrastructure/devops/security.md
      - Guides:
          - Docker Hardening: infrastructure/guides/docker_hardening.md
          - Operations Guide: infrastructure/guides/ops-guide.md
          - Rebuild Guide: infrastructure/guides/rebuild-guide.md
  - Security:
      - Overview: security/security.md
      - Architecture: security/architecture.md
      - Model Poisoning: security/model-poisoning-detection.md
      - Penetration Testing: security/penetration-testing.md
      - Incident Response: security/incident-response.md
      - Backup & Recovery: security/backup-recovery.md
      - Compliance: security/compliance.md
      - Log Redaction: security/log_redaction.md
  - Reference:
      - API Documentation: reference/api.md
      - Endpoints: reference/endpoints.md
      - Metrics: reference/metrics.md
  - Operations:
      - Chaos Testing: chaos/chaos_test_suite.md
  - Releases:
      - v2.8.0: releases/v2.8.0.md
      - All Releases: releases/index.md
  - Planning:
      - Future Improvements: planning/future-improvements.md
      - Roadmap Overview: planning/index.md
      - Enhancements: planning/ENHANCEMENTS.md
  - Support:
      - FAQ: support/faqs.md
      - VSCode Setup: support/vscode-setup.md
      - Documentation Status: support/documentation-status.md
  - Legal:
      - License: legal/license.md
      - Contributing: credits/CONTRIBUTING.md
      - Credits: credits/credits.md
