---
name: Maintenance · Actions Sync

on:
  workflow_dispatch: # Seulement manuel


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: 🔄 Force GitHub Actions Sync
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔍 Verify current workflows
        run: |
          echo "🔍 Vérification des workflows actuels..."
          echo "📁 Workflows dans .github/workflows/:"
          ls -la .github/workflows/
          echo ""
          echo "📋 Contenu des workflows:"
          for file in .github/workflows/*.yml; do
            if [ -f "$file" ]; then
              echo "📄 $file:"
              grep "^name:" "$file" || echo "  Pas de nom défini"
            fi
          done

      - name: 🧹 Force cleanup
        run: |
          echo "🧹 Forçage du nettoyage des workflows obsolètes..."
          echo "📝 Ce workflow force GitHub à se resynchroniser"
          echo "🗑️ Les workflows obsolètes devraient être supprimés automatiquement"

      - name: ✅ Cleanup complete
        run: |
          echo "✅ Nettoyage forcé terminé"
          echo "🔄 GitHub Actions devrait maintenant être synchronisé"
          echo "🗑️ Les workflows obsolètes devraient disparaître"
