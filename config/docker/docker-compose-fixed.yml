---
# 🚀 Arkalia Luna Pro — Docker Compose Corrigé v3.1
# Configuration haute performance avec sécurité renforcée et démarrage robuste

x-arkalia-defaults: &arkalia-defaults
  build:
    context: .
  volumes:
    - ./logs:/app/logs
    - ./state:/app/state:rw
    - ./config:/app/config:ro
  working_dir: /app
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
  restart: unless-stopped
  networks:
    - arkalia_network
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: false

services:
  # 🚀 Helloria — API centrale (FastAPI) Optimisée
  arkalia-api:
    <<: *arkalia-defaults
    container_name: arkalia-api
    build:
      context: .
      dockerfile: Dockerfile.simple
    ports:
      - "${PORT_API:-8000}:8000"
    command: python scripts/run/run_arkalia_api.py
    environment:
      - ARKALIA_ENV=development
      - ARKALIA_LOG_LEVEL=INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close(); print('OK')",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # 🤖 AssistantIA — Interface IA conversationnelle v2.8.0
  arkalia-assistantia:
    <<: *arkalia-defaults
    container_name: arkalia-assistantia
    build:
      context: .
      dockerfile: docker/Dockerfile.assistantia
    image: arkalia-luna-assistantia:production
    ports:
      - "${PORT_ASSISTANTIA:-8001}:8001"
    command: >
      uvicorn modules.assistantia.core:app --host 0.0.0.0 --port 8001
        --workers 1 --access-log --log-level info
    environment:
      - ASSISTANTIA_ENV=production
      - ASSISTANTIA_LOG_LEVEL=INFO
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    depends_on:
      arkalia-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.connect(('localhost', 8001)); s.close(); print('OK')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./modules/assistantia/logs:/app/modules/assistantia/logs
    networks:
      - arkalia_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # 🔁 ReflexIA — Observateur cognitif réflexif Optimisé
  reflexia:
    build:
      context: .
      dockerfile: docker/Dockerfile.reflexia
    container_name: arkalia-reflexia
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    environment:
      - REFLEXIA_ENV=production
    networks:
      - arkalia_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.connect(('localhost', 8002)); s.close(); print('OK')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      [
        "uvicorn",
        "scripts.run.run_reflexia_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
      ]
    depends_on:
      arkalia-api:
        condition: service_healthy

  # 🧠 Sandozia — Intelligence Croisée Enterprise v2.6.0 Optimisée
  arkalia-sandozia:
    <<: *arkalia-defaults
    container_name: arkalia-sandozia
    build:
      context: .
      dockerfile: docker/Dockerfile.sandozia
    image: arkalia-luna-sandozia:optimized
    command: python -m modules.sandozia.core.sandozia_core --start
    environment:
      - SANDOZIA_ENV=development
      - SANDOZIA_MONITORING_ENABLED=true
      - SANDOZIA_LOG_LEVEL=INFO
      - SANDOZIA_ENHANCED_MODE=true
    depends_on:
      reflexia:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from modules.sandozia.core.sandozia_core import SandoziaCore; print('OK')",
        ]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.8"

  # 🧠 Cognitive Reactor — Intelligence Avancée v2.7.0 Production Ready
  cognitive:
    build:
      context: .
      dockerfile: docker/Dockerfile.cognitive-reactor
    container_name: arkalia-cognitive
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    environment:
      - COGNITIVE_REACTOR_ENV=production
    networks:
      - arkalia_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.connect(('localhost', 8003)); s.close(); print('OK')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      [
        "uvicorn",
        "scripts.run.run_cognitive_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8003",
      ]
    depends_on:
      arkalia-api:
        condition: service_healthy

networks:
  arkalia_network:
    driver: bridge
    name: arkalia_network
