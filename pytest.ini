[pytest]
# Configuration pytest pour Arkalia-LUNA v2.8.0

# Répertoires de test
testpaths = tests

# Patterns de fichiers de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    performance: Tests de performance
    security: Tests de sécurité
    chaos: Tests de chaos
    slow: Tests lents
    smoke: Tests de fumée
    e2e: Tests end-to-end (E2E)
    benchmark: Tests de benchmark

# Options par défaut - Collecter TOUS les tests
addopts =
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=modules
    --cov=core
    --cov=helloria
    --cov=app
    --cov=arkalia
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=5
    --durations=10
    --durations-min=1.0
    --cov-config=.coveragerc
    # Ne pas ignorer les tests lents pour avoir une couverture complète
    # -m "not slow"
    --ignore=modules/generative_ai/generated/
    --ignore=modules/security/sandbox/
    --ignore=modules/security/watchdog/
    --ignore=modules/helloria/main.py
    --ignore=modules/helloria/state.py
    --ignore=modules/utils_enhanced/core.py

# Configuration coverage déplacée dans .coveragerc
